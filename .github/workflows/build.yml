on:
  push:
    tags:
      - "v*"

env:
  GODOTSTEAM_TEMPLATES_URL: https://github.com/GodotSteam/GodotSteam/releases/download/v4.23/godotsteam-g472-s165-gs423-templates.tar.xz

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  export_game:
    runs-on: ubuntu-latest
    name: Export ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        # steam_* paths are relative to the GodotSteam templates archive; Web has no Steam build
        include:
          - preset: DankNoonerLinux
            preset_index: 0
            needs_wine: false
            steam_template_debug: linux64/godotsteam.472.debug.template.x86_64
            steam_template_release: linux64/godotsteam.472.template.x86_64
            steam_lib: linux64/libsteam_api.so
          - preset: DankNoonerWindows
            preset_index: 1
            needs_wine: true
            steam_template_debug: win64/godotsteam.472.debug.template.win64.exe
            steam_template_release: win64/godotsteam.472.template.win64.exe
            steam_lib: win64/steam_api64.dll
          - preset: DankNoonerWeb
            preset_index: 2
            needs_wine: false
          - preset: DankNoonerMac
            preset_index: 3
            needs_wine: false
            # libsteam_api.dylib ships inside the template .app
            steam_template_debug: macos/macos.zip
            steam_template_release: macos/macos.zip
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      "$AGENT_TOOLSDIRECTORY"
          df -h /

      # wine is only used to stamp the Windows exe icon/metadata via rcedit
      - name: install wine
        id: wine_install
        if: matrix.needs_wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine64 wine32
          echo "WINE_PATH=$(which wine)" >> $GITHUB_OUTPUT

      - name: checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: install godotsteam templates
        if: matrix.steam_template_release
        env:
          STEAM_DIR: ${{ runner.temp }}/godotsteam
        run: |
          mkdir -p "$STEAM_DIR"
          curl -fsSL "$GODOTSTEAM_TEMPLATES_URL" | tar -xJ -C "$STEAM_DIR"
          sed -i '/^\[preset\.${{ matrix.preset_index }}\.options\]/,/^\[/{
            s|^custom_template/debug=.*|custom_template/debug="'"$STEAM_DIR/${{ matrix.steam_template_debug }}"'"|
            s|^custom_template/release=.*|custom_template/release="'"$STEAM_DIR/${{ matrix.steam_template_release }}"'"|
          }' v2/export_presets.cfg
          grep -n "custom_template" v2/export_presets.cfg

      - name: export game
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          # Godot 4.7.2 stable Linux headless (matches GodotSteam g472 templates)
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          # Project is in v2 subdirectory
          relative_project_path: ./v2
          archive_output: true
          cache: true
          presets_to_export: ${{ matrix.preset }}
          wine_path: ${{ steps.wine_install.outputs.WINE_PATH }}

      # GodotSteam needs the Steam API lib next to the executable
      - name: add steam api lib to archive
        if: matrix.steam_lib
        run: zip -j "${{ steps.export.outputs.archive_directory }}/${{ matrix.preset }}.zip" "${{ runner.temp }}/godotsteam/${{ matrix.steam_lib }}"

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.preset }}
          path: ${{ steps.export.outputs.archive_directory }}/*
          retention-days: 1

  create_release:
    needs: export_game
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - name: download all builds
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: /tmp/builds

      - name: create release
        uses: ncipollo/release-action@v1.18.0
        with:
          # token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          allowUpdates: true
          tag: ${{ github.ref_name }}
          artifacts: /tmp/builds/*

  deploy_pages:
    needs: export_game
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: download web build
        uses: actions/download-artifact@v4
        with:
          name: build-DankNoonerWeb
          path: /tmp/builds

      - name: extract web build for pages
        run: |
          mkdir -p /tmp/web-pages
          unzip /tmp/builds/DankNoonerWeb.zip -d /tmp/web-pages

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/web-pages

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_docker:
    needs: export_game
    runs-on: ubuntu-latest
    name: Publish Docker Image
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: download web build
        uses: actions/download-artifact@v4
        with:
          name: build-DankNoonerWeb
          path: /tmp/builds

      - name: extract web build into docker context
        run: unzip /tmp/builds/DankNoonerWeb.zip -d docker/web/html

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/web
          push: true
          tags: |
            ssebs/danknooner:latest
            ssebs/danknooner:${{ github.ref_name }}
