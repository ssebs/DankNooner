server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;
    port_in_redirect on;

    # .pck is served as application/octet-stream
    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript;
    gzip_min_length 1024;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Export filenames never change between releases, so always revalidate (ETag -> 304)
        add_header Cache-Control "no-cache";
    }
}
